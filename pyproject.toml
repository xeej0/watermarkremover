[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmremover"
version = "0.1.0"
description = "AI-powered visible watermark detection and removal (LaMa inpainting + multi-image matting)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.16",
  "pillow>=10",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "onnx>=1.15", "httpx>=0.27"]

[project.scripts]
wmremove = "wmremover.cli:main"

[tool.setuptools.packages.find]
include = ["wmremover*"]

[tool.setuptools.package-data]
wmremover = ["static/*"]
